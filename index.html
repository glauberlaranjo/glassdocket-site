<style>
/* Layout: a briefing document. A dark docket-ink hero with the thesis and three findings, then paper sections read top to bottom. */
:root {
  --paper: #f5f6f8; --sheet: #ffffff; --ink: #172031; --ink-2: #4a5568; --rule: #d8dde5;
  --hero: #14233a; --hero-ink: #f2f5f9; --hero-2: #b7c4d6; --hero-rule: #2c4060;
  --accent: #1f4e79; --accent-ink: #ffffff; --accent-soft: #e5edf6; --gold: #c99a3b;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10151c; --sheet: #171f29; --ink: #e5eaf1; --ink-2: #a8b2c1; --rule: #2b3543;
  --hero: #0b1626; --hero-ink: #eef2f7; --hero-2: #a9b8cc; --hero-rule: #22344f;
  --accent: #8db9e8; --accent-ink: #0f1722; --accent-soft: #1b2a3b; --gold: #e2bd6b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #10151c; --sheet: #171f29; --ink: #e5eaf1; --ink-2: #a8b2c1; --rule: #2b3543;
  --hero: #0b1626; --hero-ink: #eef2f7; --hero-2: #a9b8cc; --hero-rule: #22344f;
  --accent: #8db9e8; --accent-ink: #0f1722; --accent-soft: #1b2a3b; --gold: #e2bd6b; color-scheme: dark; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: var(--hero); color: var(--hero-ink); }
.hero .in { padding-block: 28px 44px; display: grid; gap: 22px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.mark { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.mark span { color: var(--gold); }
.lang { display: inline-flex; border: 1px solid var(--hero-rule); border-radius: 6px; overflow: hidden; }
.lang button { font: 500 13px var(--f-body); color: var(--hero-2); background: transparent; border: 0; padding: 6px 11px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--hero-ink); color: var(--hero); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 60px); line-height: 1.04; letter-spacing: -.02em; margin: 0; max-width: 16ch; text-wrap: balance; }
.sub { font-size: 18px; color: var(--hero-2); max-width: 60ch; margin: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0; border-top: 1px solid var(--hero-rule); }
.fact { padding: 18px 18px 4px 0; display: grid; gap: 6px; border-right: 1px solid var(--hero-rule); }
.fact:last-child { border-right: 0; }
.fact .v { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4.6vw, 44px); line-height: 1; font-variant-numeric: tabular-nums; }
.fact .k { font-size: 14px; color: var(--hero-2); max-width: 28ch; }
@media (max-width: 700px) { .fact { border-right: 0; border-bottom: 1px solid var(--hero-rule); padding-bottom: 16px; } .fact:last-child { border-bottom: 0; } }
.src { font: 12px var(--f-mono); color: var(--hero-2); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font: 600 15px var(--f-body); background: var(--gold); color: #14233a; border-radius: 6px; padding: 11px 18px; text-decoration: none; display: inline-block; }
.btn:hover { filter: brightness(1.06); }
.ghost { font-size: 14px; color: var(--hero-2); }
main .in { padding-block: 40px 56px; display: grid; gap: 44px; }
section { display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 3.4vw, 32px); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.intro { color: var(--ink-2); max-width: 64ch; margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.who { font: 600 11.5px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.35; }
.card p { margin: 0; color: var(--ink-2); font-size: 15px; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.tool .state { font: 500 12px var(--f-mono); color: var(--ink-2); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
ul.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.never { border-left: 3px solid var(--accent); }
.basis { background: var(--accent-soft); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 8px; }
.basis p { margin: 0; }
footer { border-top: 1px solid var(--rule); }
footer .in { padding-block: 18px 28px; font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
</style>

  <div class="in">

</div>

<main>
  <div class="in">
    <section>
      <h2 data-t="helpsTitle"></h2>

      <div class="cards" id="helps"></div>
    </section>

    <section>
      <h2 data-t="toolsTitle"></h2>
      <div class="tools" id="tools"></div>
    </section>

    <section>
      <h2 id="how-title"></h2>
      <p class="intro" id="how-intro"></p>
      <div class="tools" id="how-list"></div>
    </section>

    <section class="two">
      <div class="card"><h3 data-t="askTitle"></h3><p data-t="ask"></p><h3 data-t="getTitle"></h3><p data-t="get"></p></div>
      <div class="card never"><h3 data-t="neverTitle"></h3><ul class="list" id="never"></ul></div>
    </section>

    <section class="basis">
      <h3 data-t="basisTitle"></h3>
      <p data-t="basis"></p>
    </section>
  </div>
</main>

<footer><div class="in"><span data-t="foot1"></span><span data-t="foot2"></span></div></footer>

  document.querySelectorAll("[data-t]").forEach((e) => { const v = D[e.dataset.t]; if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const f = document.getElementById("facts"); f.innerHTML = ""; D.facts.forEach(([v, k]) => { const d = mk("div", "fact"); d.append(mk("span", "v", v), mk("span", "k", k)); f.appendChild(d); });
  const h = document.getElementById("helps"); h.innerHTML = ""; D.helps.forEach(([w, s, t]) => { const c = mk("div", "card"); c.append(mk("span", "who", w), mk("h3", null, s), mk("p", null, t)); h.appendChild(c); });
  const t = document.getElementById("tools"); t.innerHTML = ""; D.tools.forEach(([n, st, d]) => { const c = mk("div", "card tool"); c.append(mk("h3", null, n), mk("span", "state", st), mk("p", null, d)); t.appendChild(c); });
  document.getElementById("how-title").textContent = D.how.t;
  document.getElementById("how-intro").textContent = D.how.i;
  const hw = document.getElementById("how-list"); hw.innerHTML = ""; D.how.items.forEach(([a, b]) => { const c = mk("div", "card"); c.append(mk("h3", null, a), mk("p", null, b)); hw.appendChild(c); });
  const n = document.getElementById("never"); n.innerHTML = ""; D.never.forEach((s) => n.appendChild(mk("li", null, s)));
}
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("gd-overview-lang", lang); } catch (e) {} apply(); }));
apply();
</script>
