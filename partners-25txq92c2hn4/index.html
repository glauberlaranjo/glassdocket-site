<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GlassDocket pilot (partners).">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231f4e79%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3EG%3C/text%3E%3C/svg%3E">
<title>GlassDocket Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: a court-docket workspace. Sticky header with tabs; each tab is one working surface on a paper ground. */
:root {
  --paper: #f5f6f8; --sheet: #ffffff; --ink: #172031; --ink-2: #4a5568; --rule: #d8dde5; --grid: #e7eaf0;
  --accent: #1f4e79; --accent-ink: #ffffff; --accent-soft: #e5edf6; --muted: #b8c0cc;
  --ok: #1e6b45; --ok-bg: #e4f1e9; --bad: #a3271f; --bad-bg: #f8e5e3; --tbd: #8a5a00; --tbd-bg: #fbefd6; --na: #5b6472; --na-bg: #eceef2;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10151c; --sheet: #171f29; --ink: #e5eaf1; --ink-2: #a8b2c1; --rule: #2b3543; --grid: #232c38;
  --accent: #8db9e8; --accent-ink: #0f1722; --accent-soft: #1b2a3b; --muted: #4f5b6b;
  --ok: #7fd1a3; --ok-bg: #163025; --bad: #f19a91; --bad-bg: #3a1c1a; --tbd: #f0c46a; --tbd-bg: #35280f; --na: #b3bcc9; --na-bg: #252d38; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #10151c; --sheet: #171f29; --ink: #e5eaf1; --ink-2: #a8b2c1; --rule: #2b3543; --grid: #232c38;
  --accent: #8db9e8; --accent-ink: #0f1722; --accent-soft: #1b2a3b; --muted: #4f5b6b;
  --ok: #7fd1a3; --ok-bg: #163025; --bad: #f19a91; --bad-bg: #3a1c1a; --tbd: #f0c46a; --tbd-bg: #35280f; --na: #b3bcc9; --na-bg: #252d38; color-scheme: dark; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.pill { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.lang button { font: 500 13px var(--f-body); color: var(--ink-2); background: transparent; border: 0; padding: 6px 11px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }
nav.tabs a { font-weight: 500; font-size: 14px; color: var(--ink-2); text-decoration: none; padding: 10px 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 24px 56px; }
section.view { display: grid; gap: 20px; }
section.view[hidden] { display: none; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 4.2vw, 38px); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }
.lead { font-size: 17px; color: var(--ink-2); max-width: 66ch; }
.note { font-size: 13px; color: var(--ink-2); }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.banner { background: var(--accent-soft); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
.stat { display: grid; gap: 4px; }
.stat .v { font-family: var(--f-display); font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 13px; color: var(--ink-2); }
.tool { display: grid; gap: 8px; text-decoration: none; color: inherit; }
.tool:hover h3 { color: var(--accent); }
.go { font-weight: 600; font-size: 13.5px; color: var(--accent); }
.btn { font: 600 14px var(--f-body); background: var(--ink); color: var(--sheet); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; justify-self: start; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.btn[aria-disabled="true"] { background: var(--muted); color: var(--ink-2); cursor: default; }
.chart { position: relative; min-height: 220px; }
.tip { position: absolute; pointer-events: none; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 6px 10px; font-size: 12.5px; white-space: nowrap; z-index: 3; }
.tip .k { color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--ink); padding: 6px 8px; }
td { border-bottom: 1px solid var(--rule); padding: 8px; vertical-align: top; }
.num { text-align: right; }
th button { all: unset; cursor: pointer; }
.chip { display: inline-block; font: 600 12px var(--f-body); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.chip.presente { color: var(--ok); background: var(--ok-bg); } .chip.ausente { color: var(--bad); background: var(--bad-bg); }
.chip.tbd { color: var(--tbd); background: var(--tbd-bg); } .chip.ilegivel { color: var(--na); background: var(--na-bg); }
select, textarea { width: 100%; box-sizing: border-box; font: 13px var(--f-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
select { font-family: var(--f-body); font-size: 14px; }
textarea { min-height: 260px; resize: vertical; }
label { font-weight: 500; font-size: 13.5px; }
.nta-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .nta-grid { grid-template-columns: minmax(0, 1fr); } }
.cautions { border-left: 3px solid var(--tbd); background: var(--tbd-bg); border-radius: 0 6px 6px 0; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; }
td.cite { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.summary .big { font-family: var(--f-display); font-size: 21px; font-weight: 600; }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.terms dl { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr); gap: 0; margin: 0; }
.terms dt, .terms dd { margin: 0; padding: 10px 8px; border-bottom: 1px solid var(--rule); }
.terms dt { font-weight: 600; }
@media (max-width: 600px) { .terms dl { grid-template-columns: minmax(0, 1fr); } .terms dt { border-bottom: 0; padding-bottom: 0; } }
.est-bar { height: 10px; border-radius: 5px; background: var(--grid); position: relative; overflow: hidden; }
.est-bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .35; border-radius: 5px; }
.est-bar b { position: absolute; top: -3px; width: 3px; height: 16px; background: var(--accent); }
.lines { display: grid; gap: 6px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: 13.5px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.line .up { color: var(--ok); font-variant-numeric: tabular-nums; } .line .down { color: var(--bad); font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
footer { border-top: 1px solid var(--rule); padding-block: 16px 24px; font-size: 12.5px; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { section.view { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }

.fresh .lines { display: grid; gap: 4px; }
.fresh h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.badge { font: 600 12px var(--f-mono); border-radius: 999px; padding: 2px 10px; }
.badge.ok { color: var(--ok); background: var(--ok-bg); } .badge.pend { color: var(--tbd); background: var(--tbd-bg); }
.how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.how-grid h3 { margin: 0; font-size: 15px; } .how-grid p { margin: 4px 0 0; }

.est-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .est-grid { grid-template-columns: minmax(0, 1fr); } }
.est-form { gap: 6px; } .est-form select { margin-bottom: 6px; } .est-form select:disabled { opacity: .6; }
.est-out { display: grid; gap: 16px; min-width: 0; }
.line .flat { color: var(--ink-2); }
.cautions[hidden] { display: none; }
.nta-out { border-left: 3px solid var(--accent); padding-left: 10px; }
.legal-strip { font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--tbd-bg); border-top: 1px solid var(--rule); padding: 6px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.tool.locked { cursor: default; } .tool.locked:hover h3 { color: inherit; } .tool.locked .go { color: var(--ink-2); }
dialog#lang-dlg { max-width: min(92vw, 520px); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; background: var(--sheet); color: var(--ink); display: none; gap: 12px; }
dialog#lang-dlg[open] { display: grid; }
dialog#lang-dlg::backdrop { background: rgba(10, 16, 24, .55); }
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand"><b>GlassDocket™</b><span class="pill" data-t="pilot"></span></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="es" aria-pressed="false">Español</button>
        <button type="button" data-lang="pt" aria-pressed="false">Português</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#home" data-tab="home" data-t="tabHome"></a>
      <a href="#dashboard" data-tab="dashboard" data-t="tabDash"></a>
      <a href="#nta" data-tab="nta" data-t="tabNta"></a>
      <a href="#estimator" data-tab="estimator" data-t="tabEst"></a>
      <a href="#terms" data-tab="terms" data-t="tabTerms"></a>
      <a href="#feedback" data-tab="feedback" data-t="tabFb"></a>
    </nav>
  </div>
  <div class="legal-strip" role="note" data-t="legalStrip"></div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section class="view" id="v-home">
    <span class="eyebrow" data-t="homeEyebrow"></span>
    <h1 data-t="homeTitle"></h1>
    <p class="lead" data-t="homeLead"></p>
    <div class="banner" data-t="protoBanner"></div>
    <div class="card fresh" id="fresh-home"></div>
    <div class="grid3" id="home-stats"></div>
    <h2 data-t="homeTools"></h2>
    <div class="grid3">
      <a class="card tool" href="#dashboard"><h3 data-t="tabDash"></h3><p class="note" data-t="toolDash"></p><span class="go" data-t="open"></span></a>
      <a class="card tool" href="#nta" data-partner><h3 data-t="tabNta"></h3><p class="note" data-t="toolNta"></p><span class="go" data-t="open"></span></a>
      <a class="card tool" href="#estimator" data-partner><h3 data-t="tabEst"></h3><p class="note" data-t="toolEst"></p><span class="go" data-t="open"></span></a>
    </div>
    <h2 data-t="homeNever"></h2>
    <div class="card"><ul class="plain" id="never"></ul></div>
  </section>

  <!-- DASHBOARD -->
  <section class="view" id="v-dashboard" hidden>
    <span class="eyebrow" data-t="dashEyebrow"></span>
    <h1 data-t="dashTitle"></h1>
    <p class="lead" id="dash-lead"></p>
    <div class="card fresh" id="fresh-dash"></div>
    <div class="grid2">
      <div class="card"><h3 data-t="cTaxa"></h3><p class="note" data-t="cTaxaNote"></p><div class="chart" id="c-taxa"></div></div>
      <div class="card"><h3 data-t="cRep"></h3><p class="note" data-t="cRepNote"></p><div class="legend" id="l-rep"></div><div class="chart" id="c-rep"></div></div>
      <div class="card"><h3 data-t="cSem"></h3><p class="note" data-t="cSemNote"></p><div class="chart" id="c-sem"></div></div>
      <div class="card"><h3 data-t="cDesf"></h3><p class="note" data-t="cDesfNote"></p><div class="chart" id="c-desf"></div></div>
    </div>
    <div class="card">
      <h3 data-t="secCourts"></h3><p class="note" data-t="courtsNote"></p>
      <div class="tablewrap"><table id="tab-corte"><thead><tr>
        <th><button type="button" data-k="corte_nome" data-t="thCourt"></button></th>
        <th><button type="button" data-k="estado" data-t="thState"></button></th>
        <th class="num"><button type="button" data-k="decisoes" data-t="thDec"></button></th>
        <th class="num"><button type="button" data-k="taxa_concessao_pct" data-t="thRate"></button></th>
        <th class="num"><button type="button" data-k="pct_com_advogado" data-t="thRep"></button></th>
        <th class="num"><button type="button" data-k="pct_negativa_sem_audiencia" data-t="thSem"></button></th>
        <th class="num"><button type="button" data-k="variacao_entre_julgadores_pp" data-t="thJudge"></button></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
    <div class="card"><h3 data-t="cNat"></h3><p class="note" data-t="cNatNote"></p><div class="chart" id="c-nat"></div></div>
    <div class="card"><h3 data-t="secMethod"></h3><p class="note" data-t="m1"></p><p class="note" data-t="m2"></p><p class="note" data-t="m3"></p></div>
  </section>


  <!-- NTA -->
  <section class="view" id="v-nta" hidden>
    <span class="eyebrow" data-t="ntaEyebrow"></span>
    <h1 data-t="ntaTitle"></h1>
    <p class="lead" data-t="ntaLead"></p>
    <div class="banner" data-t="ntaBanner"></div>
    <div class="nta-grid">
      <div class="card">
        <h2 data-t="inputTitle"></h2>
        <label for="sample" data-t="sampleLabel"></label>
        <select id="sample"></select>
        <label for="nta-text" data-t="textLabel"></label>
        <textarea id="nta-text" spellcheck="false"></textarea>
        <p class="note" data-t="textHint"></p>
        <button class="btn" type="button" id="run" data-t="run"></button>
      </div>
      <div class="card" aria-live="polite">
        <h2 data-t="reportTitle"></h2>
        <div id="report"></div>
        <p class="note nta-out" data-t="ntaOutNote"></p>
        <div class="cautions"><h3 data-t="cautionsTitle"></h3><p data-t="cautionFernandes"></p><p data-t="cautionCampos"></p><p data-t="cautionNiz"></p></div>
      </div>
    </div>
  </section>

  <!-- ESTIMATOR -->
  <section class="view" id="v-estimator" hidden>
    <span class="eyebrow" data-t="estEyebrow"></span>
    <h1 data-t="estTitle"></h1>
    <p class="lead" data-t="estLead"></p>
    <div class="banner" data-t="estBanner"></div>
    <div class="est-grid">
      <form class="card est-form" id="est-form" onsubmit="return false">
        <h3 data-t="fProfile"></h3>
        <label for="e-nat" data-t="fNat"></label><select id="e-nat"></select>
        <label for="e-court" data-t="fCourt"></label><select id="e-court"></select>
        <label for="e-cust" data-t="fCust"></label><select id="e-cust"></select>
        <label for="e-rep" data-t="fRep"></label><select id="e-rep"></select>
        <label for="e-entry" data-t="fEntry"></label><select id="e-entry"></select>
        <label for="e-filed" data-t="fFiled"></label><select id="e-filed"></select>
        <label for="e-fam" data-t="fFam"></label><select id="e-fam"></select>
        <label for="e-chg" data-t="fChg"></label><select id="e-chg"></select>
        <p class="note" data-t="assume"></p>
      </form>
      <div class="est-out" aria-live="polite">
        <div class="card">
          <h3 data-t="resTitle"></h3>
          <div class="stat"><span class="v" id="e-p">–</span><span class="k" id="e-range"></span></div>
          <div class="est-bar" aria-hidden="true"><i id="e-bar-i"></i><b id="e-bar-b"></b></div>
          <p class="note" data-t="rangeNote"></p>
          <div class="cautions" id="e-warn" hidden></div>
        </div>
        <div class="card"><h3 data-t="evTitle"></h3><p id="e-ev"></p><p class="note" id="e-ev2"></p><p class="note" data-t="evNote"></p></div>
        <div class="card"><h3 data-t="whyTitle"></h3><p class="note" id="e-why-lead"></p><div class="lines" id="e-why"></div><p class="note" data-t="whyNote"></p></div>
        <div class="card"><h3 data-t="wiTitle"></h3><div class="lines" id="e-wi"></div><p class="note" data-t="wiNote"></p><p class="note" id="e-method"></p></div>
      </div>
    </div>
    <div class="card how"><h2 id="how-title"></h2><p class="note" id="how-intro"></p><div class="how-grid" id="how-list"></div></div>
  </section>


  <!-- TERMS -->
  <section class="view terms" id="v-terms" hidden>
    <span class="eyebrow" data-t="termsEyebrow"></span>
    <h1 data-t="termsTitle"></h1>
    <p class="lead" data-t="termsLead"></p>
    <div class="banner" data-t="termsBanner"></div>
    <div class="card"><dl id="terms-list"></dl></div>
  </section>


  <!-- FEEDBACK -->
  <section class="view" id="v-feedback" hidden>
    <span class="eyebrow" data-t="fbEyebrow"></span>
    <h1 data-t="fbTitle"></h1>
    <p class="lead" data-t="fbLead"></p>
    <div class="card">
      <h3 data-t="fbWhat"></h3>
      <ul class="plain" id="fb-list"></ul>
      <a class="btn" id="fb-btn" target="_blank" rel="noopener"></a>
      <p class="note" id="fb-note"></p>
    </div>
  </section>

</main>

<footer><div class="wrap" data-t="footer"></div></footer>

<dialog id="lang-dlg" aria-labelledby="lang-dlg-t">
  <h2 id="lang-dlg-t"></h2>
  <p id="lang-dlg-p"></p>
  <button class="btn" type="button" id="lang-dlg-ok"></button>

  how: {"t": "How the outcome estimator is built", "i": "In short: it learns from past court decisions, not from users, and it is tested before anyone sees a number.", "items": [["1 · It learns from public history", "The model is trained on past asylum decisions in EOIR’s public case records for the Florida and Texas immigration courts since 2014. No client data and nothing users type is used to train it."], ["2 · It is tested on cases it never saw", "Before release, it is scored on recent decisions held out from training (March–August 2026). In those tests it ranked a granted case above a denied one about 85% of the time (AUC 0.848), and its probabilities matched observed grant rates closely (average calibration error 0.2 points). The version in use was then retrained with the same settings on all decisions through August 2026."], ["3 · Pilot feedback shapes the tool, not the math", "Partners’ comments decide which factors are shown, how explanations and uncertainty are worded, what the screen needs and which errors to check. Feedback is not used as training data."], ["4 · It is refreshed with each EOIR release", "When EOIR publishes new data, the model is retrained and re-tested on the newest months. An update that performs worse is not released."]]},

  terms: [["Alcance", "Prueba de herramientas prototipo durante 6 a 8 semanas; sin costo; sin obligación de continuar."], ["Naturaleza de los resultados", "Prototipos de investigación. Los resultados son información estadística y de investigación, no asesoría legal, y no deben ser la única base de ninguna decisión legal."], ["Criterio profesional", "Las herramientas solo apoyan la investigación. El criterio jurídico corresponde exclusiva e indelegablemente al abogado o representante acreditado responsable."], ["Usuarios", "Solo abogados con licencia, representantes acreditados y personal bajo su supervisión. Las herramientas no se ofrecen a inmigrantes ni al público en general."], ["Acceso", "El Verificador de NTA y el estimador de resultados se habilitan solo para socios confirmados, tras verificar su licencia de abogado o su acreditación ante la EOIR. El enlace de acceso es solo para la organización socia y no debe compartirse ni publicarse."], ["Datos", "La etapa 1 usa solo datos públicos de la EOIR y ejemplos ficticios. Cualquier uso posterior de documentos de clientes requiere un acuerdo de datos firmado, el consentimiento del cliente cuando corresponda y procesamiento en EE. UU."], ["Sin garantías", "Las herramientas y los datos de la EOIR procesados se ofrecen «tal cual» y «según disponibilidad», sin garantías de ningún tipo, expresas o implícitas, incluida su exactitud o integridad."], ["Limitación de responsabilidad", "En la medida permitida por la ley, GlassDocket™ y su fundador no responden por daños indirectos, incidentales o consecuentes, incluidos honorarios perdidos, derivados del uso de las herramientas o de sus cifras en cualquier asunto."], ["Confidencialidad", "Las opiniones son confidenciales y solo se publican de forma anónima y agregada, salvo que el socio acepte por escrito ser nombrado."], ["Beneficio para socios", "Descuento de socio fundador del 50% sobre el plan contratado en el lanzamiento, mientras la suscripción siga activa; intransferible; hasta 3 licencias por organización. Se ofrece a todos los socios; sin relación con cartas ni recomendaciones."], ["Cartas de apoyo", "Cualquier carta o declaración sobre el piloto es totalmente voluntaria, debe reflejar solo la experiencia genuina del socio y nunca es condición para participar ni para obtener beneficio alguno."], ["Límites", "Sin resultados por juez, sin calificación de credibilidad, sin trabajo con agencias de control migratorio, sin servicios directos a inmigrantes."], ["Terminación", "Cualquiera de las partes puede terminar la participación en cualquier momento por correo electrónico."]],
